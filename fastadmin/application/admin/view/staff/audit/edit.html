<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Actor_admin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-actor_admin_id" data-rule="required" min="0" data-source="actor/admin/index" class="form-control selectpage" name="row[actor_admin_id]" type="text" value="{$row.actor_admin_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Actor_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-actor_name" data-rule="required" class="form-control" name="row[actor_name]" type="text" value="{$row.actor_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Module')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-module" data-rule="required" class="form-control" name="row[module]" type="text" value="{$row.module|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Action')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-action" data-rule="required" class="form-control" name="row[action]" type="text" value="{$row.action|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Object_type')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-object_type" data-rule="required" class="form-control" name="row[object_type]" type="text" value="{$row.object_type|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Object_legacy_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-object_legacy_id" data-rule="required" data-source="object/legacy/index" class="form-control selectpage" name="row[object_legacy_id]" type="text" value="{$row.object_legacy_id|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Content')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-content" class="form-control editor" rows="5" name="row[content]" cols="50">{$row.content|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Ip')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-ip" data-rule="required" class="form-control" name="row[ip]" type="text" value="{$row.ip|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Useragent')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-useragent" data-rule="required" class="form-control" name="row[useragent]" type="text" value="{$row.useragent|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Happened_at')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-happened_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[happened_at]" type="text" value="{$row.happened_at}">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
