<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="alert alert-info-light">
        可以从 AI 工作台直接带草稿过来。这里确认客户、合同和负责人后保存即可。
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$defaultRow.title|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属客户:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" data-rule="required" class="form-control selectpicker" name="row[customer_id]" data-live-search="true">
                <option value="">请选择客户</option>
                {foreach name="customerList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.customer_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联合同:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-contract_id" class="form-control selectpicker" name="row[contract_id]" data-live-search="true">
                <option value="">未关联合同</option>
                {foreach name="contractList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.contract_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-followup_type" data-rule="required" class="form-control selectpicker" name="row[followup_type]">
                {foreach name="followupTypeList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.followup_type" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-follow_up_at" data-rule="required" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="true" name="row[follow_up_at]" type="text" value="{$defaultRow.follow_up_at|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">下次跟进时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-next_follow_up_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[next_follow_up_at]" type="text" value="{$defaultRow.next_follow_up_at|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.status" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" name="row[owner_admin_id]" data-live-search="true">
                <option value="">请选择负责人</option>
                {foreach name="ownerList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.owner_admin_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">对接人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_name" class="form-control" name="row[contact_name]" type="text" value="{$defaultRow.contact_name|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">跟进结果:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-result_summary" class="form-control" rows="4" name="row[result_summary]">{$defaultRow.result_summary|default=''}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="5" name="row[notes]">{$defaultRow.notes|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
