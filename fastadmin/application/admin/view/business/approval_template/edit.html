<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">模板名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">审批对象:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-object_type" data-rule="required" class="form-control selectpicker" name="row[object_type]">
                {foreach name="objectTypeList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.object_type" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">模板状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.status" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">默认模板:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-is_default" class="form-control selectpicker" name="row[is_default]">
                {foreach name="isDefaultList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.is_default" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
            <span class="help-block">当前模板共有 {$row.step_count|default=0} 个有效节点。</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">金额范围:</label>
        <div class="col-xs-12 col-sm-4">
            <input id="c-min_amount" class="form-control" name="row[min_amount]" type="number" min="0" step="0.01" value="{$row.min_amount|default='0'}" placeholder="最低金额">
        </div>
        <div class="col-xs-12 col-sm-4">
            <input id="c-max_amount" class="form-control" name="row[max_amount]" type="number" min="0" step="0.01" value="{$row.max_amount|default='0'}" placeholder="最高金额，0 表示不限">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">模板说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" rows="4" name="row[description]">{$row.description|default=''}</textarea>
            <span class="help-block">如果填写了金额范围，系统会优先把该范围内的审批对象分配到此模板。</span>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存模板</button>
        </div>
    </div>
</form>
