<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票号码:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoice_no" class="form-control" name="row[invoice_no]" type="text" value="{$defaultRow.invoice_no|default=''}" placeholder="可留空，系统自动生成">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$defaultRow.title|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">采购单:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-purchase_order_id" class="form-control selectpicker" data-live-search="true" name="row[purchase_order_id]">
                <option value="">请选择采购单</option>
                {foreach name="purchaseOrderList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.purchase_order_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">采购结算:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-settlement_id" class="form-control selectpicker" data-live-search="true" name="row[settlement_id]">
                <option value="">未关联采购结算</option>
                {foreach name="purchaseSettlementList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.settlement_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-invoice_type" data-rule="required" class="form-control selectpicker" name="row[invoice_type]">
                {foreach name="invoiceTypeList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.invoice_type" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoice_amount" data-rule="required" class="form-control" step="0.01" name="row[invoice_amount]" type="number" value="{$defaultRow.invoice_amount|default='0.00'}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">税额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tax_amount" class="form-control" step="0.01" name="row[tax_amount]" type="number" value="{$defaultRow.tax_amount|default='0.00'}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">不含税金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-untaxed_amount" class="form-control" step="0.01" name="row[untaxed_amount]" type="number" value="{$defaultRow.untaxed_amount|default='0.00'}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">开票日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoiced_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[invoiced_at]" type="text" value="{$defaultRow.invoiced_at|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">收票时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-received_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[received_at]" type="text" value="{$defaultRow.received_at|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">发票状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.status" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" data-live-search="true" name="row[owner_admin_id]">
                <option value="">请选择</option>
                {foreach name="ownerList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.owner_admin_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]">{$defaultRow.notes|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
