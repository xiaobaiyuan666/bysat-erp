<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="erp-form-note">合同先录名称、客户、金额和负责人。开票、回款、附件可以随着执行过程持续补充。</div>
    <div class="erp-form-section">合同基础</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同编号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contract_no" class="form-control" name="row[contract_no]" type="text" value="" placeholder="留空自动生成">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属客户:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_id" data-rule="required" class="form-control selectpicker" name="row[customer_id]">
                <option value="">请选择</option>
                {foreach name="customerList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同分类:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-category" data-rule="required" class="form-control selectpicker" name="row[category]">
                {foreach name="categoryList" item="vo"}
                <option value="{$key}" {in name="key" value="service"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {in name="key" value="draft"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" class="form-control" step="0.01" name="row[amount]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">已开票金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-invoice_total" class="form-control" step="0.01" name="row[invoice_total]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">已回款金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-received_total" class="form-control" step="0.01" name="row[received_total]" type="number" value="0.00">
        </div>
    </div>
    <div class="erp-form-section">周期与归属</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">签约日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-signed_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[signed_at]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">开始日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[start_date]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">结束日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-end_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[end_date]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" name="row[owner_admin_id]">
                <option value="">请选择</option>
                {foreach name="ownerList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联 APP:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-app_project_id" class="form-control selectpicker" name="row[app_project_id]">
                {foreach name="appProjectList" item="vo"}
                <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">附件与备注</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">合同附件:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-attachment_ids_json" name="row[attachment_ids_json]" type="hidden" value="[]">
            <div class="input-group">
                <input id="c-attachment_summary" class="form-control" type="text" value="未选择附件" readonly>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-primary" id="btn-choose-attachments">选择附件</button>
                </span>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-default" id="btn-view-attachments" disabled>查看附件</button>
                </span>
            </div>
            <p class="help-block">可选合同扫描件、回款凭证、报价单等附件。</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
