<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="erp-form-note">编辑付款申请时重点确认金额、状态和负责人，已生成的申请单号不建议修改。</div>
    <div class="erp-form-section">申请信息</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">申请单号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-request_no" class="form-control" name="row[request_no]" type="text" value="{$row.request_no|default=''}" readonly>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">申请标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">采购单:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-purchase_order_id" class="form-control selectpicker" data-live-search="true" name="row[purchase_order_id]">
                <option value="">未关联采购单</option>
                {foreach name="purchaseOrderList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.purchase_order_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">采购结算:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-settlement_id" class="form-control selectpicker" data-live-search="true" name="row[settlement_id]">
                <option value="">未关联采购结算</option>
                {foreach name="purchaseSettlementList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.settlement_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">付款计划:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-payment_plan_id" class="form-control selectpicker" data-live-search="true" name="row[payment_plan_id]">
                <option value="">未关联付款计划</option>
                {foreach name="paymentPlanList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.payment_plan_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">金额与状态</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">申请金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-request_amount" data-rule="required" class="form-control" step="0.01" name="row[request_amount]" type="number" value="{$row.request_amount|default='0.00'}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">申请时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-requested_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[requested_at]" type="text" value="{$row.requested_at|default=''}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.status" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" data-live-search="true" name="row[owner_admin_id]">
                <option value="">请选择</option>
                {foreach name="ownerList" item="vo" key="key"}
                <option value="{$key}" {eq name="row.owner_admin_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">备注</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]">{$row.notes|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
