<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属模板:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-template_id" data-rule="required" class="form-control selectpicker" data-live-search="true" name="row[template_id]">
                <option value="">请选择审批模板</option>
                {foreach name="templateList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.template_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">审批层级:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-step_no" data-rule="required;integer" class="form-control" name="row[step_no]" type="number" min="1" value="{$defaultRow.step_no|default='1'}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">节点名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-step_name" data-rule="required" class="form-control" name="row[step_name]" type="text" value="{$defaultRow.step_name|default=''}" placeholder="例如：财务复核">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">审批人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-approver_admin_id" data-rule="required" class="form-control selectpicker" data-live-search="true" name="row[approver_admin_id]">
                <option value="">请选择审批人</option>
                {foreach name="approverList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.approver_admin_id" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">节点状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo" key="key"}
                <option value="{$key}" {eq name="defaultRow.status" value="$key"}selected{/eq}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">节点说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]" placeholder="补充这个审批节点需要关注的内容">{$defaultRow.notes|default=''}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存节点</button>
        </div>
    </div>
</form>
