<style>
    .ai-setting-helper {
        margin: 16px 16px 0;
        padding: 18px 20px;
        border-radius: 10px;
        background: #f8fbff;
        border: 1px solid #e2edf8;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
    }

    .ai-setting-helper h4 {
        margin: 0 0 6px;
        font-size: 16px;
        font-weight: 600;
        color: #1f2d3d;
    }

    .ai-setting-helper p {
        margin: 0;
        color: #6b7b8d;
        font-size: 12px;
        line-height: 1.7;
    }
</style>

<div class="panel panel-default panel-intro">
    {:build_heading()}

    <div class="ai-setting-helper">
        <div>
            <h4>先配模型，再去 AI 工作台直接问</h4>
            <p>这里支持 OpenAI 兼容协议。建议至少保留一条默认模型，并先做一次“测试连接”，确认接口、模型和 Key 都可用。</p>
        </div>
        <div class="btn-group">
            <a href="{:url('ai/conversation/index')}" class="btn btn-primary addtabsit">
                <i class="fa fa-comments-o"></i> 打开 AI 工作台
            </a>
            <a href="{:url('ai/setting/add')}" class="btn btn-success btn-dialog" data-area='["72%","86%"]'>
                <i class="fa fa-plus"></i> 新增模型
            </a>
        </div>
    </div>

    <div class="panel-body">
        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i></a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('ai/setting/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> 新增</a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('ai/setting/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> 编辑</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('ai/setting/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> 删除</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('ai/setting/edit')}"
                           data-operate-del="{:$auth->check('ai/setting/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
