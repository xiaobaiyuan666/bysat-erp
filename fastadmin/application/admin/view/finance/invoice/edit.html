<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="erp-form-note">修改单据时重点核对对象、金额、到期日和状态。附件可以重新选择或后续补传。</div>
    <div class="erp-form-section">单据信息</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单据类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-kind" data-rule="required" class="form-control selectpicker" name="row[kind]">
                {foreach name="kindList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.kind"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">单据标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">往来对象:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-counterparty" data-rule="required" class="form-control" name="row[counterparty]" type="text" value="{$row.counterparty|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" class="form-control" step="0.01" name="row[amount]" type="number" value="{$row.amount|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">到期日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-due_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[due_date]" type="text" value="{$row.due_date}">
        </div>
    </div>
    <div class="erp-form-section">状态与归属</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
            {foreach name="statusList" item="vo"}
            <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
            {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                    <option value="{$key}" {in name="key" value="$row.project_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">备注与附件</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="5" name="row[notes]" cols="50">{$row.notes|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">附件:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-attachment_ids_json" name="row[attachment_ids_json]" type="hidden" value="{$row.attachment_ids_json|default='[]'|htmlentities}">
            <div class="input-group">
                <input id="c-attachment_summary" class="form-control" type="text" value="未选择附件" readonly>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-primary" id="btn-choose-attachments">选择附件</button>
                </span>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-default" id="btn-view-attachments" disabled>查看附件</button>
                </span>
            </div>
            <p class="help-block">支持补传后重新选择，保存时会更新附件ID列表。</p>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
