<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">记账日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-transaction_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[transaction_date]" type="text" value="{:date('Y-m-d')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">收支类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-type" data-rule="required" class="form-control selectpicker" name="row[type]">
                {foreach name="typeList" item="vo"}
                    <option value="{$key}" {in name="key" value="expense"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">科目分类:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-category" data-rule="required" class="form-control" name="row[category]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">往来对象:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-counterparty" data-rule="required" class="form-control" name="row[counterparty]" type="text" value="">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">金额:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-amount" data-rule="required" class="form-control" step="0.01" name="row[amount]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">支付方式:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-payment_method" data-rule="required" class="form-control selectpicker" name="row[payment_method]">
                {foreach name="paymentMethodList" item="vo"}
                    <option value="{$key}" {in name="key" value="bank"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                    <option value="{$key}" {in name="key" value="0"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="5" name="row[notes]" cols="50"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">附件:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-attachment_ids_json" name="row[attachment_ids_json]" type="hidden" value="[]">
            <div class="input-group">
                <input id="c-attachment_summary" class="form-control" type="text" value="未选择附件" readonly>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-primary" id="btn-choose-attachments">选择附件</button>
                </span>
                <span class="input-group-btn">
                    <button type="button" class="btn btn-default" id="btn-view-attachments" disabled>查看附件</button>
                </span>
            </div>
            <p class="help-block">支持在附件中心上传后再选择，保存时会记录附件ID。</p>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
