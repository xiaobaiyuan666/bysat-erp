<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营项目:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" value="{$row.name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">APP 名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-app_name" data-rule="required" class="form-control" name="row[app_name]" type="text" value="{$row.app_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">当前版本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-app_version" data-rule="required" class="form-control" name="row[app_version]" type="text" value="{$row.app_version|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-manager_admin_id" data-rule="required" class="form-control selectpicker" name="row[manager_admin_id]">
                {foreach name="managerAdminList" item="vo"}
                <option value="{$key}" {if $key==$row.manager_admin_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-client_owner" class="form-control" name="row[client_owner]" type="text" value="{$row.client_owner|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务线:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-business_line" class="form-control" name="row[business_line]" type="text" value="{$row.business_line|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">核心指标:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-core_metric" class="form-control" name="row[core_metric]" type="text" value="{$row.core_metric|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">生命周期:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-lifecycle_stage" data-rule="required" class="form-control selectpicker" name="row[lifecycle_stage]">
                {foreach name="lifecycleStageList" item="vo"}
                <option value="{$key}" {if $key==$row.lifecycle_stage}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">项目状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {if $key==$row.status}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">优先级:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-priority" data-rule="required" class="form-control selectpicker" name="row[priority]">
                {foreach name="priorityList" item="vo"}
                <option value="{$key}" {if $key==$row.priority}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">开始日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[start_date]" type="text" value="{$row.start_date}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">结束日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-end_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[end_date]" type="text" value="{$row.end_date}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">预算:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-budget" class="form-control" step="0.01" name="row[budget]" type="number" value="{$row.budget|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">实际成本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-actual_cost" class="form-control" step="0.01" name="row[actual_cost]" type="number" value="{$row.actual_cost|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营渠道:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-channel" class="form-control" name="row[channel]" type="text" value="{$row.channel|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联交付项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                <option value="{$key}" {if $key==$row.project_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">目标说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-target" class="form-control" rows="4" name="row[target]">{$row.target|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">项目说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" rows="4" name="row[description]">{$row.description|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
