<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="alert alert-info" style="margin:0 0 18px;">
        项目运营用于承接 APP、小程序、官网、活动投放等互联网项目。APP 只是其中一种类型。
    </div>
    <div class="erp-form-section">项目基础</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">项目类型:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_type" data-rule="required" class="form-control selectpicker" name="row[project_type]">
                {foreach name="projectTypeList" item="vo"}
                <option value="{$key}" {if $key=='app'}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
            <div id="project-type-help" class="help-block" style="margin-bottom:0;"></div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营项目:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" data-rule="required" class="form-control" name="row[name]" type="text" placeholder="例如：春季增长活动">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" data-label="project-subject">APP名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-app_name" data-rule="required" class="form-control" name="row[app_name]" type="text" placeholder="例如：猿创 CRM">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2" data-label="project-version">当前版本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-app_version" class="form-control" name="row[app_version]" type="text" placeholder="例如：v2.3.0">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-manager_admin_id" data-rule="required" class="form-control selectpicker" name="row[manager_admin_id]">
                {foreach name="managerAdminList" item="vo"}
                <option value="{$key}" {if $key==0}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务负责人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-client_owner" class="form-control" name="row[client_owner]" type="text" placeholder="例如：王总">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">业务线:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-business_line" class="form-control" name="row[business_line]" type="text" placeholder="例如：SaaS 增长">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">核心指标:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-core_metric" class="form-control" name="row[core_metric]" type="text" placeholder="例如：新增线索、次留、付费转化">
        </div>
    </div>
    <div class="erp-form-section">运营状态</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">生命周期:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-lifecycle_stage" data-rule="required" class="form-control selectpicker" name="row[lifecycle_stage]">
                {foreach name="lifecycleStageList" item="vo"}
                <option value="{$key}" {if $key=='validation'}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">项目状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {if $key=='planning'}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">优先级:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-priority" data-rule="required" class="form-control selectpicker" name="row[priority]">
                {foreach name="priorityList" item="vo"}
                <option value="{$key}" {if $key=='medium'}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">排期与预算</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">开始日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-start_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[start_date]" type="text" value="{:date('Y-m-d')}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">结束日期:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-end_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="false" name="row[end_date]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">预算:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-budget" class="form-control" step="0.01" name="row[budget]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">实际成本:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-actual_cost" class="form-control" step="0.01" name="row[actual_cost]" type="number" value="0.00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">运营渠道:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-channel" class="form-control" name="row[channel]" type="text" placeholder="例如：应用市场、微信生态、私域、广告投放">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联交付项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                <option value="{$key}" {if $key==0}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="erp-form-section">目标与说明</div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">目标说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-target" class="form-control" rows="4" name="row[target]" placeholder="写清楚本阶段目标、关键打法和验收口径"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">项目说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-description" class="form-control" rows="4" name="row[description]" placeholder="补充背景、资源约束或重点提醒"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
