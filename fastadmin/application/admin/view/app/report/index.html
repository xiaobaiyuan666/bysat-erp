<style>
    .erp-summary-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 14px;
        margin-bottom: 18px;
    }

    .erp-summary-card {
        background: #fff;
        border: 1px solid #e6ebf2;
        border-radius: 14px;
        padding: 16px 18px;
        box-shadow: 0 8px 22px rgba(31, 45, 61, 0.05);
    }

    .erp-summary-card-title {
        display: block;
        color: #52616b;
        font-size: 13px;
        font-weight: 600;
    }

    .erp-summary-card-value {
        display: block;
        margin: 10px 0 8px;
        font-size: 28px;
        line-height: 1;
        color: #1f2d3d;
        font-weight: 700;
    }

    .erp-summary-card-hint {
        color: #7b8794;
        font-size: 12px;
        line-height: 1.7;
    }

    .erp-summary-card.primary {
        border-color: #dbeafe;
        background: linear-gradient(135deg, #f8fbff 0%, #eef6ff 100%);
    }

    .erp-summary-card.info {
        border-color: #d9f0ff;
        background: linear-gradient(135deg, #f8fcff 0%, #eff8ff 100%);
    }

    .erp-summary-card.success {
        border-color: #d8efe0;
        background: linear-gradient(135deg, #f8fcf9 0%, #edf9f0 100%);
    }

    .erp-summary-card.danger {
        border-color: #f3d1d1;
        background: linear-gradient(135deg, #fff9f9 0%, #fff1f1 100%);
    }
</style>

<div class="panel panel-default panel-intro">
    <div class="panel-heading">
        {:build_heading(null,FALSE)}
        <div class="panel-lead">
            <em>项目汇报</em>
            先看整体提交情况，再回到明细处理。这里统一记录项目本周进展、阶段结果、阻塞项和下步动作。
        </div>
    </div>

    <div class="panel-body">
        <div class="erp-summary-grid">
            {foreach name="summaryCards" item="item"}
            <div class="erp-summary-card {$item.theme}">
                <span class="erp-summary-card-title">{$item.title}</span>
                <span class="erp-summary-card-value">{$item.value}</span>
                <span class="erp-summary-card-hint">{$item.hint}</span>
            </div>
            {/foreach}
        </div>

        <div id="myTabContent" class="tab-content">
            <div class="tab-pane fade active in" id="one">
                <div class="widget-body no-padding">
                    <div id="toolbar" class="toolbar">
                        <a href="javascript:;" class="btn btn-primary btn-refresh" title="{:__('Refresh')}"><i class="fa fa-refresh"></i> </a>
                        <a href="javascript:;" class="btn btn-success btn-add {:$auth->check('app/report/add')?'':'hide'}" title="{:__('Add')}"><i class="fa fa-plus"></i> {:__('Add')}</a>
                        <a href="javascript:;" class="btn btn-success btn-edit btn-disabled disabled {:$auth->check('app/report/edit')?'':'hide'}" title="{:__('Edit')}"><i class="fa fa-pencil"></i> {:__('Edit')}</a>
                        <a href="javascript:;" class="btn btn-danger btn-del btn-disabled disabled {:$auth->check('app/report/del')?'':'hide'}" title="{:__('Delete')}"><i class="fa fa-trash"></i> {:__('Delete')}</a>
                    </div>
                    <table id="table" class="table table-striped table-bordered table-hover table-nowrap"
                           data-operate-edit="{:$auth->check('app/report/edit')}"
                           data-operate-del="{:$auth->check('app/report/del')}"
                           width="100%">
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
