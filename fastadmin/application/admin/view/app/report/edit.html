<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('App_project_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-app_project_id" data-rule="required" class="form-control selectpicker" name="row[app_project_id]">
                <option value="">请选择所属项目</option>
                {foreach name="appProjectList" item="vo"}
                <option value="{$key}" {in name="key" value="$row.app_project_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Report_date')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-report_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[report_date]" type="text" value="{$row.report_date}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Owner_admin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" name="row[owner_admin_id]">
                <option value="">请选择汇报人</option>
                {foreach name="staffList" item="vo"}
                <option value="{$key}" {in name="key" value="$row.owner_admin_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Summary')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-summary" class="form-control" rows="5" name="row[summary]" placeholder="写本周做了什么、客户反馈了什么、推进到了哪一步">{$row.summary|htmlentities}</textarea>
            <p class="help-block">建议优先写清楚本周完成事项和对业务最重要的变化。</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Result')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-result" class="form-control" rows="5" name="row[result]" placeholder="写当前阶段结果、数据变化、客户确认结果或上线情况">{$row.result|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Next_actions')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-next_actions" class="form-control" rows="5" name="row[next_actions]" placeholder="写下一步动作、负责人、预期完成时间">{$row.next_actions|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Blockers')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-blockers" class="form-control" rows="5" name="row[blockers]" placeholder="写当前卡点、依赖项、审批问题或资源问题；没有可留空">{$row.blockers|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
