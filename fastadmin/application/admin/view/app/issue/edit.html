<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">问题单号:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-ticket_no" class="form-control" name="row[ticket_no]" type="text" value="{$row.ticket_no|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户名称:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer" data-rule="required" class="form-control" name="row[customer]" type="text" value="{$row.customer|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">联系人:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_name" class="form-control" name="row[contact_name]" type="text" value="{$row.contact_name|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">联系电话:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-contact_phone" class="form-control" name="row[contact_phone]" type="text" value="{$row.contact_phone|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">问题标题:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">问题概述:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-summary" class="form-control" rows="4" name="row[summary]">{$row.summary|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">来源:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-source" data-rule="required" class="form-control selectpicker" name="row[source]">
                {foreach name="sourceList" item="vo"}
                <option value="{$key}" {if $key==$row.source}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">反馈渠道:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-channel" data-rule="required" class="form-control selectpicker" name="row[channel]">
                {foreach name="channelList" item="vo"}
                <option value="{$key}" {if $key==$row.channel}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">问题分类:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-category" data-rule="required" class="form-control selectpicker" name="row[category]">
                {foreach name="categoryList" item="vo"}
                <option value="{$key}" {if $key==$row.category}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">处理状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" data-rule="required" class="form-control selectpicker" name="row[status]">
                {foreach name="statusList" item="vo"}
                <option value="{$key}" {if $key==$row.status}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">优先级:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-priority" data-rule="required" class="form-control selectpicker" name="row[priority]">
                {foreach name="priorityList" item="vo"}
                <option value="{$key}" {if $key==$row.priority}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">受理人:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-assignee_admin_id" class="form-control selectpicker" name="row[assignee_admin_id]">
                {foreach name="assigneeAdminList" item="vo"}
                <option value="{$key}" {if $key==$row.assignee_admin_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">所属 APP:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-app_project_id" class="form-control selectpicker" name="row[app_project_id]">
                {foreach name="appProjectList" item="vo"}
                <option value="{$key}" {if $key==$row.app_project_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联交付项目:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-project_id" class="form-control selectpicker" name="row[project_id]">
                {foreach name="projectList" item="vo"}
                <option value="{$key}" {if $key==$row.project_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联研发待办:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-tech_ticket_id" class="form-control selectpicker" name="row[tech_ticket_id]">
                {foreach name="techTicketList" item="vo"}
                <option value="{$key}" {if $key==$row.tech_ticket_id}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">创建时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-opened_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[opened_at]" type="text" value="{$row.opened_at}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">最近跟进:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-last_follow_up_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[last_follow_up_at]" type="text" value="{$row.last_follow_up_at}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">承诺解决时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-resolve_due_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[resolve_due_at]" type="text" value="{$row.resolve_due_at}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">下一步动作:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-next_action" class="form-control" rows="3" name="row[next_action]">{$row.next_action|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">已回告客户:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_notified" class="form-control selectpicker" name="row[customer_notified]">
                {foreach name="notifyList" item="vo"}
                <option value="{$key}" {if $key==$row.customer_notified}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回告对象:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer_notified_to" class="form-control" name="row[customer_notified_to]" type="text" value="{$row.customer_notified_to|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回告方式:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer_notified_channel" class="form-control" name="row[customer_notified_channel]" type="text" value="{$row.customer_notified_channel|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回告时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer_notified_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[customer_notified_at]" type="text" value="{$row.customer_notified_at}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">回告结果:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-customer_feedback_result" class="form-control" rows="3" name="row[customer_feedback_result]">{$row.customer_feedback_result|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户已确认:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-customer_confirmed" class="form-control selectpicker" name="row[customer_confirmed]">
                {foreach name="notifyList" item="vo"}
                <option value="{$key}" {if $key==$row.customer_confirmed}selected{/if}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户确认时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-customer_confirmed_at" class="form-control datetimepicker" data-date-format="YYYY-MM-DD HH:mm:ss" data-use-current="false" name="row[customer_confirmed_at]" type="text" value="{$row.customer_confirmed_at}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">客户确认说明:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-customer_confirmation_note" class="form-control" rows="3" name="row[customer_confirmation_note]">{$row.customer_confirmation_note|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">内部备注:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="3" name="row[notes]">{$row.notes|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">保存</button>
        </div>
    </div>
</form>
