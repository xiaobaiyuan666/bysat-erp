<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('App_project_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-app_project_id" data-rule="required" class="form-control selectpicker" name="row[app_project_id]">
                <option value="">请选择所属项目</option>
                {foreach name="appProjectList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="" placeholder="例如：客服标准回复口径、版本发布操作手册">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Category')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-category" data-rule="required" class="form-control selectpicker" name="row[category]">
                {foreach name="categoryList" item="vo"}
                <option value="{$key}" {in name="key" value="manual"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Owner_admin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" name="row[owner_admin_id]">
                <option value="">请选择负责人</option>
                {foreach name="ownerAdminList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Version_tag')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-version_tag" data-rule="required" class="form-control" name="row[version_tag]" type="text" value="" placeholder="例如：v1.0、2026Q1、客服版">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Applicable_versions')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-applicable_versions" data-rule="required" class="form-control" name="row[applicable_versions]" type="text" value="" placeholder="填写适用项目阶段、版本范围或使用部门">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Expires_on')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-expires_on" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[expires_on]" type="text" value="">
            <p class="help-block">如果资料长期有效，可以留空。</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Archive_status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="archiveStatusList" item="vo"}
                <label for="row[archive_status]-{$key}"><input id="row[archive_status]-{$key}" name="row[archive_status]" type="radio" value="{$key}" {in name="key" value="active"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Replacement_material_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-replacement_material_id" class="form-control selectpicker" name="row[replacement_material_id]">
                <option value="">不设置替代资料</option>
                {foreach name="materialList" item="vo"}
                <option value="{$key}">{$vo}</option>
                {/foreach}
            </select>
            <p class="help-block">如果这份资料后续有新版替代，可以先在这里挂上替代关系。</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Download_name')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-download_name" class="form-control" name="row[download_name]" type="text" value="" placeholder="例如：客服FAQ.pdf">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Download_url')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-download_url" class="form-control" name="row[download_url]" type="text" value="" placeholder="上传附件或填写现成下载地址">
                <span class="input-group-btn">
                    <button type="button" id="faupload-download_url" class="btn btn-danger faupload" data-input-id="c-download_url" data-multiple="false"><i class="fa fa-upload"></i> {:__('Upload')}</button>
                </span>
                <span class="input-group-btn">
                    <button type="button" id="fachoose-download_url" class="btn btn-primary fachoose" data-input-id="c-download_url" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button>
                </span>
            </div>
            <input id="c-file_path" name="row[file_path]" type="hidden" value="">
            <p class="help-block">支持直接上传资料文件，也可以只放内部下载链接。</p>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Notes')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]" placeholder="写清楚这份资料适合谁用、什么场景下用、需要注意什么"></textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
