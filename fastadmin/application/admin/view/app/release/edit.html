<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="alert alert-info" style="margin:0 0 18px;">
        版本发布不只用于 APP，也可以记录小程序、官网、活动投放等项目的上线、回告和回滚安排。
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('App_project_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-app_project_id" data-rule="required" class="form-control selectpicker" name="row[app_project_id]">
                <option value="">请选择</option>
                {foreach name="appProjectList" item="vo"}
                <option value="{$key}" {in name="key" value="$row.app_project_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Version')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-version" data-rule="required" class="form-control" name="row[version]" type="text" value="{$row.version|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Title')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text" value="{$row.title|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="statusList" item="vo"}
                <label for="row[status]-{$key}"><input id="row[status]-{$key}" name="row[status]" type="radio" value="{$key}" {in name="key" value="$row.status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Owner_admin_id')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-owner_admin_id" data-rule="required" class="form-control selectpicker" name="row[owner_admin_id]">
                <option value="">请选择</option>
                {foreach name="ownerAdminList" item="vo"}
                <option value="{$key}" {in name="key" value="$row.owner_admin_id"}selected{/in}>{$vo}</option>
                {/foreach}
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Release_date')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-release_date" class="form-control datetimepicker" data-date-format="YYYY-MM-DD" data-use-current="true" name="row[release_date]" type="text" value="{$row.release_date}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Channel')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-channel" data-rule="required" class="form-control" name="row[channel]" type="text" value="{$row.channel|htmlentities}">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联研发待办:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tech_ticket_ids_json" class="form-control selectpage" name="row[tech_ticket_ids_json]" type="text" value="{$row.tech_ticket_ids_value|htmlentities}" data-source="app/tech_ticket/index" data-primary-key="id" data-field="title" data-multiple="true" data-pagination="true" placeholder="可多选研发待办">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">关联问题记录:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-service_ticket_ids_json" class="form-control selectpage" name="row[service_ticket_ids_json]" type="text" value="{$row.service_ticket_ids_value|htmlentities}" data-source="app/issue/index" data-primary-key="id" data-field="title" data-multiple="true" data-pagination="true" placeholder="可多选问题记录">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Customer_sync_status')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="radio">
                {foreach name="customerSyncStatusList" item="vo"}
                <label for="row[customer_sync_status]-{$key}"><input id="row[customer_sync_status]-{$key}" name="row[customer_sync_status]" type="radio" value="{$key}" {in name="key" value="$row.customer_sync_status"}checked{/in} /> {$vo}</label>
                {/foreach}
            </div>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Customer_sync_note')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-customer_sync_note" class="form-control" rows="4" name="row[customer_sync_note]">{$row.customer_sync_note|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Verification_summary')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-verification_summary" class="form-control" rows="4" name="row[verification_summary]">{$row.verification_summary|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Release_result')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-release_result" class="form-control" rows="4" name="row[release_result]">{$row.release_result|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Release_notes')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-release_notes" class="form-control" rows="4" name="row[release_notes]">{$row.release_notes|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Rollback_plan')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-rollback_plan" class="form-control" rows="4" name="row[rollback_plan]">{$row.rollback_plan|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Rollback_ready')}:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-rollback_ready" class="form-control selectpicker" name="row[rollback_ready]">
                <option value="0" {eq name="row.rollback_ready" value="0"}selected{/eq}>否</option>
                <option value="1" {eq name="row.rollback_ready" value="1"}selected{/eq}>是</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('Notes')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-notes" class="form-control" rows="4" name="row[notes]">{$row.notes|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
